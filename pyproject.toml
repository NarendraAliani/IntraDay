[tool.poetry]
name = "intraday"
version = "0.8.0"
description = "Intraday Indian cash-equity algorithmic trading platform. Checkpoint 8: domain contracts + configuration management + persistence + first business API (configuration read/activate) — no strategy/broker/market-data business logic."
authors = ["Narendra Aliani"]
license = "Proprietary"
readme = "README.md"
packages = [{ include = "intraday", from = "src" }]

[tool.poetry.dependencies]
python = "^3.12"
django = "^5.1"
djangorestframework = "^3.15"
channels = "^4.1"
channels-redis = "^4.2"
daphne = "^4.1"
celery = "^5.4"
redis = "^5.0"
psycopg = { extras = ["binary"], version = "^3.2" }
structlog = "^24.4"
drf-spectacular = "^0.27"
python-dotenv = "^1.0"
pyyaml = "^6.0"
django-cors-headers = "^4.9.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
pytest-django = "^4.9"
ruff = "^0.6"
mypy = "^1.11"
django-stubs = "^5.0"
djangorestframework-stubs = "^3.15"
hypothesis = "^6.112"
import-linter = "^2.1"
schemathesis = "^3.35"
pip-audit = "^2.7"
types-pyyaml = "^6.0"

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"

# ---------------------------------------------------------------------------
# Ruff — linter + formatter (Checkpoint 3 decision: replaces flake8/isort/
# black/pyupgrade with one tool). See docs/architecture/TECHNOLOGY_MAPPING.md
# §3.
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]
extend-exclude = ["**/migrations/*.py", ".venv", "frontend"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "S",   # flake8-bandit (security)
]
ignore = [
    "S101", # allow `assert` — used extensively by pytest and Django's own idioms
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S106"] # tests may assert freely and use literal (non-secret) test tokens

[tool.ruff.lint.isort]
known-first-party = ["intraday"]

[tool.ruff.format]
quote-style = "double"
docstring-code-format = true

# ---------------------------------------------------------------------------
# mypy — strict on project code only. Third-party stubs are supplemented
# (django-stubs, djangorestframework-stubs); anything without stubs is
# explicitly allowed to be untyped rather than pretending it is strict.
# See docs/architecture/TECHNOLOGY_MAPPING.md §3.
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["intraday"]
plugins = ["mypy_django_plugin.main"]
strict = true
warn_unused_ignores = true
show_error_codes = true
exclude = ["migrations/"]

[[tool.mypy.overrides]]
module = ["celery.*", "channels.*", "channels_redis.*", "drf_spectacular.*", "structlog.*"]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "intraday.settings.testing"

# ---------------------------------------------------------------------------
# pytest / pytest-django
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "intraday.settings.testing"
python_files = ["test_*.py"]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
